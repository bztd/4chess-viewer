name: compile_ubuntu

on: [push]

# env:
  # BUILD_TYPE: Release

permissions:
  contents: read

jobs:
  compile_latest_and_test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout_git
        uses: actions/checkout@v7
        with:
          fetch-depth: 15
      - name: install_packages
        run: |
             sudo apt-get update
             sudo apt-get install appstream appstream-util cmake desktop-file-utils doxygen gettext libwxgtk3.2-dev ninja-build pandoc xvfb at-spi2-core dbus po4a lintian weston tidy
      - name: validate_appdata
        run: |
             appstream-util validate data/4ChessViewer.appdata.xml
      - name: configure
        run: |
             export CXXFLAGS="-Wall -Wextra -ansi -Werror -Wpedantic"
             mkdir build
             cd build
             cmake -G "Ninja" ..
      - name: compile
        run: |
             cd build
             cmake --build .
      - name: download_linuxdeploy #appImage
        #if: startsWith(github.ref, 'refs/tags/v')
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
      - name: appimage_Image
        #if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p AppDir/usr/bin
          cp build/4chessviewer AppDir/usr/bin/
          chmod +x AppDir/usr/bin/4chessviewer
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --desktop-file data/4ChessViewer.desktop \
            --icon-file data/4ChessViewer.png \
            --output appimage
      - name: upload_artifact
        uses: actions/upload-artifact@v7
        with:
          name: 4ChessViewer-ubuntu-${{ github.sha }}
          path: ./*.AppImage
          retention-days: 3
      - name: publish_release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            *.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
